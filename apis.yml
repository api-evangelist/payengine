apis:
- name: PayEngine Platform API
  description: >-
    REST API for merchant onboarding, card and ACH transaction processing (auth, sale,
    capture, void, refund, offline and device sale), card and bank-account tokenization,
    gateway orchestration, hosted payment links, subscriptions, disputes and reporting.
    Authenticated server-to-server with an HTTP Basic partner private key; embedded UI is
    authorized with a short-lived merchant session token. The full reference is gated
    behind a partner login.
