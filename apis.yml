aid: payengine
name: PayEngine
description: >-
  PayEngine is an embedded-payments and payment-facilitation platform for vertical market
  SaaS companies, operated by Platform Factory, Inc. It lets a software company offer
  payments to its own customers without building an acquiring stack: PayEngine handles
  merchant onboarding and underwriting, PCI-scoped card and bank-account capture through
  hosted SecureFields and a <pay-engine> web-component library, card and ACH processing
  with 3-D Secure, AVS and Level 2/Level 3 interchange data, network tokenization, Tap to
  Pay and cloud-connected terminals, hosted payment links, subscriptions, disputes,
  settlement and payouts. A gateway-orchestration layer routes across multiple
  processors. The platform is a PCI DSS Level 1 certified Service Provider, listed in
  Visa's Global Registry under Platform Factory, Inc. Integration is REST plus a signed
  webhook surface of 37 documented events; the REST reference itself requires a partner
  login.
