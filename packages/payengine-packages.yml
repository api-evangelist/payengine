name: PayEngine client libraries and distributions
summary: >-
  PayEngine publishes first-party client libraries across six distribution channels -
  npm (web/JS and React Native), pub.dev (Flutter), WordPress.org (WooCommerce gateway
  plugin), Swift Package Manager (iOS and SoftPOS), and a CDN-hosted web-component
  bundle. All npm packages are published by the payengine-dev account under a
  @payengine.co address, which is how first-party ownership was established. There is no
  Python, Ruby, Go, Java, .NET or Rust client. The PHP SDK on GitHub has not been pushed
  since February 2023 and carries no tagged release.
