summary: >-
  PayEngine publishes no priced plans. Its pricing page names three pricing COMPONENTS -
  platform SaaS fees, a variable buy-rate markup, and customized models - but attaches no
  numbers, no currency, no billing period and no included quota to any of them. Every
  path ends at "Get a Custom Quote" or a demo request. This is the standard posture for a
  payfac-as-a-service platform whose economics are a revenue share negotiated per
  partner, but it means a buyer cannot compare PayEngine on price without a sales call.
